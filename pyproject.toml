[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanistic_router"
version = "0.3.0"
description = "Mechanistic LLM Router: High-Performance LLM Routing via Encoder-Target Decoupling, Prefill Probing, Conformal Risk Control, & SAE Circuit Analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Vinicius Caridá", email = "vfcarida@gmail.com"}
]
keywords = [
    "llm-routing",
    "mechanistic-interpretability",
    "conformal-risk-control",
    "sparse-autoencoders",
    "activation-probing",
    "optimal-transport",
    "model-cascades"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed"
]
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "torch>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "litellm>=1.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "httpx>=0.24.0",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-exporter-prometheus>=0.41b0",
    "pyyaml>=6.0"
]

[project.urls]
Homepage = "https://github.com/vfcarida/mechanistic-llm-router"
Repository = "https://github.com/vfcarida/mechanistic-llm-router"
Documentation = "https://github.com/vfcarida/mechanistic-llm-router/tree/main/docs"
Issues = "https://github.com/vfcarida/mechanistic-llm-router/issues"

[project.scripts]
mechanistic-router = "mechanistic_router.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "types-pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.23.0"
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "pytest-mock>=3.11.0",
    "scikit-learn>=1.3.0"
]
docs = [
    "mkdocs-material>=9.4.0",
    "mkdocstrings[python]>=0.23.0"
]
probe = [
    "transformers>=4.40.0",
    "scikit-learn>=1.3.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests", "experiments/mechanistic_probe/tests"]
addopts = ["-p", "no:deepeval"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Header",
    "fastapi.Query",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
