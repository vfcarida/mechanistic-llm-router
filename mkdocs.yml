site_name: Mechanistic LLM Router Documentation
site_description: White-Box LLM Routing via Encoder-Target Decoupling, Causal Activation Probing, Conformal Risk Control & Sparse Autoencoders
site_author: Vinicius Caridá

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guides:
      - Causal Probing: guides/causal-probe.md
      - RouterBench Evaluation: guides/routerbench.md
  - Architecture: architecture.md
  - Reference:
      - Configuration: reference/config.md
      - Routers & Strategies: reference/routers.md
      - Gateway REST API: reference/gateway.md
  - Development:
      - Testing Guide: development/testing.md
      - Release Process: development/releasing.md
  - Reports:
      - Baseline Record: BASELINE.md
      - Mechanistic Spike: MECHANISTIC_SPIKE_REPORT.md
      - Benchmark Report: BENCHMARK_REPORT.md
  - References & Bibliography: REFERENCES.md

