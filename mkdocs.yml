site_name: Mechanistic LLM Router Documentation
site_description: Research Prototype for LLM Routing via Encoder-Target Decoupling, Prefill Probing & Sparse Autoencoders
site_author: Vinicius Carida

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]

nav:
  - Home: index.md
  - Architecture: architecture.md
  - Baseline Record: BASELINE.md
