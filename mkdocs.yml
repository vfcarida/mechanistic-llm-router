site_name: Mechanistic LLM Router Documentation
site_description: Research Prototype for LLM Routing via Encoder-Target Decoupling, Prefill Probing & Sparse Autoencoders
site_author: Vinicius Carida

theme:
  name: material
  palette:
    - scheme: slate
      primary: indigo
      accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guides:
      - Causal Probing: guides/causal-probe.md
      - RouterBench Evaluation: guides/routerbench.md
  - Architecture: architecture.md
  - Reports:
      - Baseline Record: BASELINE.md
      - Mechanistic Spike: MECHANISTIC_SPIKE_REPORT.md
      - Benchmark Report: BENCHMARK_REPORT.md
